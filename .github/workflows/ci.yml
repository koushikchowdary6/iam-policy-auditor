name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Smoke-test CLI exit status contract
        shell: bash
        run: |
          # Exit 1 means the policy was audited and exceeded the severity
          # threshold. Exit 2 means a parse/runtime error, never success.
          set +e
          python src/iam_auditor.py examples/admin_wildcard.json --fail-on HIGH
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected HIGH-risk policy exit 1; got $status"
            exit 1
          fi
          python src/iam_auditor.py examples/least_privilege.json --fail-on LOW

      - name: Generate and validate SARIF security-review evidence
        if: matrix.python-version == '3.12'
        run: |
          python src/iam_auditor.py examples/admin_wildcard.json --sarif > iam-admin-findings.sarif
          python src/iam_auditor.py examples/least_privilege.json --sarif > iam-least-privilege.sarif
          python src/iam_auditor.py examples/deny_notprincipal_boundary.json --sarif > iam-notprincipal-boundary.sarif
          python - <<'PY'
          import json
          from pathlib import Path
          risky = json.loads(Path("iam-admin-findings.sarif").read_text())
          clean = json.loads(Path("iam-least-privilege.sarif").read_text())
          boundary = json.loads(Path("iam-notprincipal-boundary.sarif").read_text())
          assert risky["version"] == clean["version"] == "2.1.0"
          assert risky["runs"][0]["tool"]["driver"]["name"] == "IAM Policy Auditor"
          assert any(row["level"] == "error" for row in risky["runs"][0]["results"])
          assert clean["runs"][0]["results"] == []
          boundary_results = boundary["runs"][0]["results"]
          assert len(boundary_results) == 1
          assert boundary_results[0]["level"] == "warning"
          assert boundary_results[0]["ruleId"] == "IAM-DENY-WITH-NOTPRINCIPAL-AND-PERMISSIONS-BOUNDARIES"
          PY

      - name: Upload offline IAM SARIF examples
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: iam-sarif-example-evidence
          path: |
            iam-admin-findings.sarif
            iam-least-privilege.sarif
            iam-notprincipal-boundary.sarif
          if-no-files-found: error
          retention-days: 30
